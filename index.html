<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e27" />

  <title>DStudio | Code Editor & Development Environment</title>

  <meta
    name="description"
    content="DStudio - Professional code editor and development environment"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      background: #0a0e27;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
    }

    body {
      color: #e0e0e0;
    }

    button {
      border: none;
      outline: none;
    }

    textarea {
      width: 100%;
      height: 100%;
      resize: none;
      border: none;
      outline: none;
      padding: 16px;
      background: #0f1527;
      color: #e0e0e0;
      font-size: 14px;
      line-height: 1.6;
      font-family:
        "Fira Code",
        "Consolas",
        monospace;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(102, 126, 234, 0.4);
      border-radius: 10px;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 60px;
      background: #0f1527;
      border-bottom: 1px solid rgba(102, 126, 234, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      color: #667eea;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn.secondary {
      background: rgba(102, 126, 234, 0.1);
      border: 1px solid rgba(102, 126, 234, 0.2);
      color: #667eea;
    }

    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 240px;
      background: #0a0e27;
      border-right: 1px solid rgba(102, 126, 234, 0.15);
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-title {
      padding: 16px;
      color: #667eea;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .file {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
      color: #b0b0b0;
      user-select: none;
    }

    .file:hover {
      background: rgba(102, 126, 234, 0.1);
    }

    .file.active {
      background: rgba(102, 126, 234, 0.2);
      border-left: 3px solid #667eea;
      color: white;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .editor {
      flex: 1;
      overflow: hidden;
    }

    .console {
      height: 140px;
      background: #09101f;
      border-top: 1px solid rgba(102, 126, 234, 0.15);
      overflow-y: auto;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
    }

    .console-line {
      margin-bottom: 6px;
      color: #4caf50;
    }

    .preview {
      width: 50%;
      border-left: 1px solid rgba(102, 126, 234, 0.15);
      background: white;
    }

    @media (max-width: 900px) {
      .workspace {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 180px;
      }

      .preview {
        width: 100%;
        height: 40%;
        border-left: none;
        border-top: 1px solid rgba(102, 126, 234, 0.15);
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide React FIXED -->
  <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.min.js"></script>

  <script type="text/babel">
    const {
      Code2,
      Play,
      Save,
      Eye,
      Plus,
      FileText,
      Folder,
    } = LucideReact;

    const { useState, useEffect } = React;

    function App() {
      const [files, setFiles] = useState([]);
      const [activeFileId, setActiveFileId] = useState(null);
      const [editorValue, setEditorValue] = useState("");
      const [consoleLogs, setConsoleLogs] = useState([]);
      const [showPreview, setShowPreview] = useState(true);

      useEffect(() => {
        const starterFiles = [
          {
            id: 1,
            name: "index.html",
            type: "html",
            content: `<!DOCTYPE html>
<html>
<head>
  <title>DStudio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Hello DStudio 🚀</h1>
    <button id="btn">Click Me</button>
    <div id="output"></div>
  </div>

  <script src="script.js"><\/script>
</body>
</html>`
          },

          {
            id: 2,
            name: "style.css",
            type: "css",
            content: `body{
  margin:0;
  font-family:sans-serif;
  background:#667eea;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:white;
  padding:40px;
  border-radius:20px;
  text-align:center;
}

button{
  padding:12px 20px;
  border:none;
  background:#764ba2;
  color:white;
  border-radius:10px;
  cursor:pointer;
}`
          },

          {
            id: 3,
            name: "script.js",
            type: "javascript",
            content: `const btn = document.getElementById("btn");
const output = document.getElementById("output");

let count = 0;

btn.onclick = () => {
  count++;
  output.innerHTML = "Clicked " + count + " times";
};`
          }
        ];

        setFiles(starterFiles);
        setActiveFileId(1);
        setEditorValue(starterFiles[0].content);
      }, []);

      const activeFile = files.find((f) => f.id === activeFileId);

      const openFile = (file) => {
        setActiveFileId(file.id);
        setEditorValue(file.content);
      };

      const saveFile = () => {
        const updated = files.map((file) =>
          file.id === activeFileId
            ? { ...file, content: editorValue }
            : file
        );

        setFiles(updated);

        setConsoleLogs((prev) => [
          ...prev,
          `[SAVE] ${activeFile.name} saved`
        ]);
      };

      const runCode = () => {
        const updatedFiles = files.map((file) =>
          file.id === activeFileId
            ? { ...file, content: editorValue }
            : file
        );

        setFiles(updatedFiles);

        const html =
          updatedFiles.find((f) => f.type === "html")?.content || "";

        const css =
          updatedFiles.find((f) => f.type === "css")?.content || "";

        const js =
          updatedFiles.find((f) => f.type === "javascript")?.content || "";

        const finalHTML = `
<!DOCTYPE html>
<html>
<head>
<style>
${css}
</style>
</head>
<body>

${html.replace(/<script.*?><\\/script>/gi, "")}

<script>
try {
${js}
} catch(err){
document.body.innerHTML += '<pre style="color:red">'+err+'</pre>';
}
<\/script>

</body>
</html>
`;

        const iframe = document.getElementById("preview-frame");

        if (iframe) {
          iframe.srcdoc = finalHTML;

          setConsoleLogs((prev) => [
            ...prev,
            "[SUCCESS] Preview rendered"
          ]);
        }
      };

      const addFile = () => {
        const newFile = {
          id: Date.now(),
          name: "newFile.js",
          type: "javascript",
          content: ""
        };

        setFiles((prev) => [...prev, newFile]);
      };

      return (
        <div className="app">
          <div className="header">
            <div className="logo">
              <Code2 size={28} />
              <span>DStudio</span>
            </div>

            <div className="controls">
              <button className="btn secondary" onClick={addFile}>
                <Plus size={16} />
                File
              </button>

              <button className="btn secondary" onClick={saveFile}>
                <Save size={16} />
                Save
              </button>

              <button className="btn" onClick={runCode}>
                <Play size={16} />
                Run
              </button>

              <button
                className="btn secondary"
                onClick={() => setShowPreview(!showPreview)}
              >
                <Eye size={16} />
                {showPreview ? "Hide" : "Show"}
              </button>
            </div>
          </div>

          <div className="workspace">
            <div className="sidebar">
              <div className="sidebar-title">
                Project Files
              </div>

              {files.map((file) => (
                <div
                  key={file.id}
                  className={
                    file.id === activeFileId
                      ? "file active"
                      : "file"
                  }
                  onClick={() => openFile(file)}
                >
                  <FileText size={16} />
                  {file.name}
                </div>
              ))}
            </div>

            <div className="main">
              <div className="editor">
                <textarea
                  value={editorValue}
                  onChange={(e) =>
                    setEditorValue(e.target.value)
                  }
                />
              </div>

              <div className="console">
                {consoleLogs.map((log, index) => (
                  <div
                    key={index}
                    className="console-line"
                  >
                    {log}
                  </div>
                ))}
              </div>
            </div>

            {showPreview && (
              <div className="preview">
                <iframe
                  id="preview-frame"
                  sandbox="allow-scripts"
                  title="preview"
                ></iframe>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(
      document.getElementById("root")
    );

    root.render(<App />);
  </script>
</body>
</html>
